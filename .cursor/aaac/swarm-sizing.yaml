# Swarm sizing SSOT — complexity scores drive per-phase Task agent targets
# Plan artifact weights stay in complexity.yaml; this file consumes them for swarm tiers.
# Policy: .cursor/policies/context-budget.md

version: 1
plan_complexity_ref: complexity.yaml

phase_classes:
  scope_driven:
    - discover
    - investigate_lite
    - investigate_swarm
    - research_swarm
    - check_swarm
  change_driven:
    - validate
    - impact_analysis
    - dependency_graph
    - fitness_functions
    - rollback
    - verify
    - review_swarm
    - report
  fixed:
    - plan
    - execute
    - test_execute
    - write
    - parse
    - persist
    - review
    - campaign_init
    - scan
    - plan_waves
    - debt_sweep
    - satisfaction_gate
    - root_cause

floors:
  discover: 4
  investigate_lite: 3
  plan: 2
  validate: 3
  impact_analysis: 2
  dependency_graph: 2
  fitness_functions: 3
  rollback: 2
  root_cause: 2
  check_swarm: 3
  investigate_swarm: 7
  research_swarm: 6
  test_execute: 1
  verify: 3
  verify_fix: 3
  review_swarm: 3
  report: 2
  execute: 1

ceilings:
  discover: 8
  investigate_lite: 5
  investigate_swarm: 9
  research_swarm: 8
  check_swarm: 9
  validate: 4
  impact_analysis: 3
  dependency_graph: 3
  fitness_functions: 4
  rollback: 3
  verify: 5
  review_swarm: 4
  report: 3
  root_cause: 3

command_overrides:
  remediate-app:
    check_swarm: 7

bootstrap:
  weights:
    intent_tokens_over_200: 1
    intent_tokens_over_500: 2
    no_domain_slug: 1
    verb_fix: 2
    verb_create: 1
    object_maturity_critical: 2
    object_maturity_protected: 3

scope_weights:
  files_in_scope_per_5: 1
  files_in_scope_baseline: 5
  cross_domain: 3
  migration_mentioned: 2
  protected_object: 2
  intent_ambiguity_medium: 2
  intent_ambiguity_high: 4
  open_questions_per_item: 1
  remediation_actionable_per_10: 1
  remediation_protected_hits: 3
  remediation_cross_app: 2
  article_type_diagrams: -1

scope_tiers:
  discover:
    - { max: 2, agents: 4 }
    - { max: 6, agents: 5 }
    - { max: 10, agents: 6 }
    - { max: 999, agents: 8 }
  investigate_lite:
    - { max: 3, agents: 3 }
    - { max: 8, agents: 4 }
    - { max: 999, agents: 5 }
  investigate_swarm:
    - { max: 4, agents: 7 }
    - { max: 10, agents: 8 }
    - { max: 999, agents: 9 }
  research_swarm:
    - { max: 3, agents: 6 }
    - { max: 8, agents: 7 }
    - { max: 999, agents: 8 }
  check_swarm:
    - { max: 5, agents: 3 }
    - { max: 12, agents: 5 }
    - { max: 20, agents: 7 }
    - { max: 999, agents: 9 }

change_weights:
  plan_score_multiplier: 1
  blast_radius:
    low: 0
    medium: 2
    high: 4
  confidence_penalty_multiplier: 4
  paths_to_touch_per_path_over_3: 0.25
  dependency_violations_per_item: 1

change_tiers:
  validate:
    - { max: 4, agents: 3 }
    - { max: 10, agents: 4 }
    - { max: 999, agents: 4 }
  impact_analysis:
    - { max: 4, agents: 2 }
    - { max: 10, agents: 3 }
    - { max: 999, agents: 3 }
  dependency_graph:
    - { max: 4, agents: 2 }
    - { max: 10, agents: 3 }
    - { max: 999, agents: 3 }
  fitness_functions:
    - { max: 4, agents: 3 }
    - { max: 10, agents: 4 }
    - { max: 999, agents: 4 }
  rollback:
    - { max: 6, agents: 2 }
    - { max: 12, agents: 3 }
    - { max: 999, agents: 3 }
  verify:
    - { max: 4, agents: 3 }
    - { max: 10, agents: 4 }
    - { max: 999, agents: 5 }
  review_swarm:
    - { max: 4, agents: 3 }
    - { max: 10, agents: 4 }
    - { max: 999, agents: 4 }
  report:
    - { max: 4, agents: 2 }
    - { max: 10, agents: 3 }
    - { max: 999, agents: 3 }
