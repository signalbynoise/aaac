# AAAC model routing SSOT.
# Provider lock: Grok 4.6 variants only. Other providers are rejected at load time.
version: 1
provider: grok
family: grok-4.6

tiers:
  fast: cursor-grok-4.6-medium-fast
  codex: cursor-grok-4.6-high
  reasoning: cursor-grok-4.6-xhigh

default_tier: fast

phases:
  discover: fast
  investigate_lite: fast
  investigate_swarm: fast
  research_swarm: fast
  check_swarm: fast
  verify: fast
  review_swarm: fast

  plan: reasoning
  validate: reasoning
  impact_analysis: reasoning
  dependency_graph: reasoning
  fitness_functions: reasoning
  rollback: reasoning
  root_cause: reasoning
  report: reasoning

  execute: codex
  test_execute: codex
  debt_sweep: codex

  scan: null # parent_only
  parse: null # parent_only
  campaign_init: null # parent_only
  plan_waves: null # parent_only
  satisfaction_gate: null # parent_only

agent_specs:
  code-author: codex
  test-author: codex
  discovery-*: fast
  fix-*: fast

subagent_types:
  explore: fast
  shell: fast
