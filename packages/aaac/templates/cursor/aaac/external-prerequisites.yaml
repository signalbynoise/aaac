# External tools AAAC expects beyond the framework install.
# SSOT for init CLI prompts + install-sweep-report.md
version: 1
prerequisites:
  - id: cursor-hooks
    name: Cursor Hooks
    tier: required
    installable: false
    why: Run lifecycle enforcement (create/advance/gate edits) requires Hooks enabled in Cursor.
    used_by:
      - all AAAC slash commands
      - gate-write / stop hooks
    manual_hint: Open Cursor → Settings → Hooks → enable Hooks, then restart Cursor.

  - id: nodejs
    name: Node.js
    tier: required
    installable: false
    why: AAAC CLI, generators, and run-engine scripts require Node 18+.
    used_by:
      - aaac init / generate
      - .cursor/aaac/scripts/run-engine/*
    manual_hint: Install Node.js 18 or newer (https://nodejs.org/).

  - id: fallow
    name: Fallow
    tier: recommended
    installable: true
    why: Architecture fitness, changed-file checks, and /remediate-app campaigns invoke the Fallow CLI.
    used_by:
      - fallow-check-changed (verify)
      - /remediate-app
      - fitness / dead-code flows
    install:
      kind: npm-devdep
      package: fallow
    manual_hint: pnpm add -D fallow   # or: npm i -D fallow

  - id: playwright
    name: Playwright
    tier: optional
    installable: true
    why: E2E verify paths and some project overlays expect Playwright when configured.
    used_by:
      - test / E2E verify agents (when project uses Playwright)
    install:
      kind: npm-devdep
      package: "@playwright/test"
    manual_hint: pnpm add -D @playwright/test && pnpm exec playwright install

  - id: database-mcp
    name: Database MCP (e.g. Supabase)
    tier: optional
    installable: false
    why: Migrations, RLS, and advisor checks use a configured database MCP when the project has a DB.
    used_by:
      - database domain flows
      - security / RLS fitness
    manual_hint: Connect Supabase (or your DB) MCP in Cursor Settings; document project ref in docs/project_context.md.

  - id: security-docs
    name: Workspace security policy
    tier: optional
    installable: false
    why: AAAC security fitness follows workspace docs and policies — add your guidelines so agents adhere to them.
    used_by:
      - fitness security
      - security skills / review
    manual_hint: Add docs/security.md and .cursor/policies/security.md pointing at it; optional .cursor/rules/security.mdc for always-on rules.
