name: Publish @ludecker/aaac

on:
  push:
    tags:
      - "aaac-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Agentic bridge package tests
        run: pnpm --filter @ludecker/agentic-bridge test

      - name: Publish agentic-bridge if missing or behind
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          LOCAL=$(node -p "require('./packages/agentic-bridge/package.json').version")
          CURRENT=$(npm view @ludecker/agentic-bridge version 2>/dev/null || true)
          if [ "$CURRENT" = "$LOCAL" ]; then
            echo "agentic-bridge@$LOCAL already on npm — skip"
          else
            echo "Publishing @ludecker/agentic-bridge@$LOCAL (registry has '${CURRENT:-none}')"
            pnpm --filter @ludecker/agentic-bridge publish --access public --no-git-checks
          fi

      - name: AAAC package tests
        run: pnpm --filter @ludecker/aaac test

      - name: Init smoke test
        run: node packages/aaac/src/cli.mjs init --yes --dir /tmp/aaac-smoke-ci

      - name: Publish with pnpm (no npm CLI)
        run: pnpm --filter @ludecker/aaac publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
