# Experience graph retrieval constants (SSOT)
# Consumed by experience/paths.mjs — keep in sync with docs.

version: 1

semantic_candidates: 32
lexical_candidates: 16
graph_expansion_hops: 1
max_neighbours_per_seed: 8
rerank_limit: 96
final_lessons: 5
max_warnings: 3

rrf_k: 60
mmr_lambda: 0.7

hnsw:
  metric: cos
  connectivity: 16
  ef_construction: 100
  ef_search: 48
  dimensions: 384

embedding:
  # hash matches experience/packaged-index (ships with npm; works offline).
  # Repo index: prefer AAAC_EMBEDDING_PROVIDER=local when @huggingface/transformers
  # is installed, then `node .cursor/aaac/scripts/run-engine/rebuild-repo-index.mjs --provider local`.
  default_provider: hash
  packaged_provider: hash
  local_model: Xenova/all-MiniLM-L6-v2
  remote_model: text-embedding-3-small
  dimensions: 384

slots:
  - meaning
  - trigger
  - failure
  - remedy

# V6 — repository memory retrieval (discover retrieve-then-verify)
repo_memory:
  final_nodes: 12
  max_invariants: 8
  graph_hops: 1
  semantic_candidates: 32
  lexical_candidates: 16
  scratchpad_max_chars: 4000
  index_max_files: 4000
  # Agents retrieve production logic. Test fixtures are not graph nodes.
  index_include_tests: false
  blast_depth: 3
  blast_cap: 40
  flow_max_hops: 6
  relations_max_impact: 12
  relations_max_flows: 8
  relations_max_clusters: 8
  # V-next — span-first retrieval (AST symbols inside Stage-1 files)
  span_envelope_lines: 4
  envelope_max_chars: 2400
  final_spans: 8
  spans_per_file: 2
  max_symbols_per_file: 80
  symbol_neighbor_files: 8
  stage1_neighbor_files: 6
  basename_boost: 0.25
  # Progressive-read hard budgets (per agent; enforced by preToolUse gate)
  max_agent_files_read: 6
  max_full_file_opens: 2
  max_gap_search_globs: 8
  # Check-swarm capsule: host resolver only
  max_expansions: 3
  max_files_per_expansion: 4

ranking:
  semantic_similarity: 0.38
  trigger_similarity: 0.16
  structural_match: 0.12
  outcome_value: 0.14
  repository_affinity: 0.08
  recency: 0.06
  graph_support: 0.06
  contradiction_penalty: 0.15
  failure_penalty: 0.10
  redundancy_penalty: 0.08
  bayes_alpha: 1
  bayes_beta: 1
  recency_half_life_days: 730
